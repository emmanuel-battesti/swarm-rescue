name: 'Setup Environment & Run Tests'
description: 'Installe les dépendances système, configure le projet Python et lance pytest.'

inputs:
  python-version:
    description: 'Version de Python à installer'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    - name: Install system packages (Ubuntu only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config xvfb \
          libjpeg-dev zlib1g-dev libtiff5-dev libfreetype6-dev liblcms2-dev libwebp-dev libopenjp2-7-dev \
          libx11-6 libxext6 libxrender1 libxcb1 libxrandr2 libxcursor1 libxinerama1 libxss1 libxkbcommon0 libdbus-1-3 || true

    - name: Install project
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        python -m pip install -e ".[dev]"

    - name: Install Mesa3D software OpenGL (Windows only)
      # Les runners Windows n'exposent que l'OpenGL 1.1 "GDI generic", sans
      # WGL_ARB_pixel_format : pyglet/arcade échoue donc à créer le contexte.
      # On dépose Mesa3D (llvmpipe) à côté de python.exe pour obtenir un vrai
      # contexte OpenGL 3.3+ logiciel, exactement comme Xvfb le fait sur Linux.
      # Non bloquant : si l'installation échoue, les tests GL sont ignorés par
      # tests/conftest.py au lieu de faire échouer le job.
      if: runner.os == 'Windows'
      continue-on-error: true
      shell: bash
      env:
        MESA_VERSION: '26.2.3'
      run: |
        set -euo pipefail
        MESA_DIR="$(cygpath -u "$RUNNER_TEMP")/mesa3d"
        mkdir -p "$MESA_DIR"
        curl -fsSL --retry 3 -o "$MESA_DIR/mesa.7z" \
          "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"

        SEVEN_ZIP="/c/Program Files/7-Zip/7z.exe"
        if [ ! -f "$SEVEN_ZIP" ]; then
          SEVEN_ZIP="$(command -v 7z || command -v 7za || true)"
        fi
        if [ -z "$SEVEN_ZIP" ]; then
          echo "::error::7-Zip introuvable, impossible d'extraire Mesa3D"
          exit 1
        fi
        "$SEVEN_ZIP" x -y -o"$(cygpath -w "$MESA_DIR/extracted")" "$(cygpath -w "$MESA_DIR/mesa.7z")" > /dev/null

        # DLL search order : le dossier de l'exécutable (python.exe) est
        # recherché avant System32, on y dépose opengl32.dll + ses dépendances
        # (libgallium_wgl.dll, dxil.dll...). C'est l'équivalent Windows du
        # déploiement "per-application" décrit par mesa-dist-win.
        PYTHON_DIR="$(cygpath -u "$(python -c 'import os, sys; print(os.path.dirname(sys.executable))')")"
        echo "Python directory: $PYTHON_DIR"
        cp "$MESA_DIR/extracted/x64/"*.dll "$PYTHON_DIR/"
        ls "$PYTHON_DIR" | grep -i '^opengl32\.dll$'

        # Secours: lu par tests/conftest.py via os.add_dll_directory(), utile
        # si la copie ci-dessus est masquée par une DLL déjà chargée.
        echo "MESA_DLL_DIR=$(cygpath -w "$MESA_DIR/extracted/x64")" >> "$GITHUB_ENV"

    - name: Report OpenGL backend (Windows & macOS)
      if: runner.os != 'Linux'
      continue-on-error: true
      shell: bash
      run: |
        python - <<'PY'
        import os
        if os.name == "nt" and os.getenv("MESA_DLL_DIR"):
            os.add_dll_directory(os.environ["MESA_DLL_DIR"])
        import arcade
        window = arcade.Window(width=64, height=64, visible=False)
        info = window.ctx.info
        print("GL_VENDOR  :", info.VENDOR)
        print("GL_RENDERER:", info.RENDERER)
        print("GL_VERSION :", f"{info.MAJOR_VERSION}.{info.MINOR_VERSION}")
        window.close()
        PY

    - name: Run pytest (Linux with Xvfb)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        xvfb-run python -m pytest -q

    - name: Run pytest (Windows & macOS)
      if: runner.os != 'Linux'
      shell: bash
      env:
        # Force Mesa sur le rasterizer logiciel (le runner n'a pas de GPU).
        GALLIUM_DRIVER: llvmpipe
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: |
        python -m pytest -q