# CI workflow for running tests across multiple OSes
# Note: GitHub Actions runners do not reliably provide GPU/OpenGL
# support (libEGL / drivers may be missing). Tests that require shaders
# are skipped on CI (see tests using pytest.skipif(GITHUB_ACTIONS)).

name: Test d'Installation Multi-OS

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  priority-check:
    name: Vérification prioritaire (ubuntu-24.04, python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system packages & dependencies (robust)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xvfb \
            libjpeg-dev zlib1g-dev libtiff5-dev libfreetype6-dev liblcms2-dev libwebp-dev libopenjp2-7-dev \
            libx11-6 libxext6 libxrender1 libxcb1 libxrandr2 libxcursor1 libxinerama1 libxss1 libxkbcommon0 libdbus-1-3 || true

      - name: Install project (editable)
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests examples

      - name: Run pytest with Xvfb
        run: |
          xvfb-run python -m pytest -q

  build-and-test:
    name: Tests matrix (s'exécute seulement si priorité OK)
    needs: priority-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: ubuntu-26.04
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system packages (Ubuntu only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xvfb \
            libjpeg-dev zlib1g-dev libtiff5-dev libfreetype6-dev liblcms2-dev libwebp-dev libopenjp2-7-dev \
            libx11-6 libxext6 libxrender1 libxcb1 libxrandr2 libxcursor1 libxinerama1 libxss1 libxkbcommon0 libdbus-1-3 || true

      - name: Install project (editable)
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e ".[dev]"

      - name: Run pytest (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run python -m pytest -q

      - name: Run pytest (Windows & macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pytest -q
